# Gradle 配置
# 标准 GitHub Actions ubuntu-latest 为 16GB RAM；本地 16GB 机器可安全使用 6GB 堆
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 启用 Daemon 以复用构建进程（显著提升增量构建速度）
org.gradle.daemon=true
# 启用配置缓存（Gradle 7.0+，可显著减少配置阶段时间）
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android 配置
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Kotlin 配置
kotlin.code.style=official

# 编译优化
android.enableR8.fullMode=true

# 缩短 project cache 目录名，缓解 Windows 路径长度限制
org.gradle.projectcachedir=.gpc
