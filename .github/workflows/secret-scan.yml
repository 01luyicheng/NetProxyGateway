# Secret scanning with gitleaks
# Triggers on all PRs and nightly schedule
name: Secret Scan

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 3 * * *'   # nightly at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secret Scan
    runs-on: [self-hosted, Linux, X64, do-sfo3]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # initial baseline: collect findings before enforcing
