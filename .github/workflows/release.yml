name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (if signing config available)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/apk/release/app-release-unsigned.apk "$KEY_ALIAS"
          jarsigner -verify app/build/outputs/apk/release/app-release-unsigned.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-signed.apk
          rm release.keystore

      - name: Rename APK for release
        working-directory: ./android
        run: |
          if [ -f app/build/outputs/apk/release/app-release-signed.apk ]; then
            mv app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/netproxy-gateway-${{ github.ref_name }}.apk
          else
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/netproxy-gateway-${{ github.ref_name }}-unsigned.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - binary: api
            os: linux
            arch: amd64
          - binary: api
            os: linux
            arch: arm64
          - binary: api
            os: windows
            arch: amd64
            ext: .exe
          - binary: api
            os: darwin
            arch: amd64
          - binary: api
            os: darwin
            arch: arm64
          - binary: socks5-proxy
            os: linux
            arch: amd64
          - binary: socks5-proxy
            os: linux
            arch: arm64
          - binary: socks5-proxy
            os: windows
            arch: amd64
            ext: .exe
          - binary: socks5-proxy
            os: darwin
            arch: amd64
          - binary: socks5-proxy
            os: darwin
            arch: arm64
          - binary: tunnel
            os: linux
            arch: amd64
          - binary: tunnel
            os: linux
            arch: arm64
          - binary: tunnel
            os: windows
            arch: amd64
            ext: .exe
          - binary: tunnel
            os: darwin
            arch: amd64
          - binary: tunnel
            os: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build ${{ matrix.binary }} for ${{ matrix.os }}/${{ matrix.arch }}
        working-directory: ./server/${{ matrix.binary }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          output_name="${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$output_name" .
          echo "Built: $output_name"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}
          path: server/${{ matrix.binary }}/${{ matrix.binary }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-android, build-go]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            See [CHANGELOG.md](./CHANGELOG.md) for details.

            ## Assets

            ### Android
            - `netproxy-gateway-*.apk` - Android application

            ### Server Binaries
            - `api-*` - API server binary
            - `socks5-proxy-*` - SOCKS5 proxy server binary
            - `tunnel-*` - Tunnel server binary

            Available for Linux (amd64, arm64), Windows (amd64), and macOS (amd64, arm64).
          files: |
            artifacts/**/*.apk
            artifacts/**/api-*
            artifacts/**/socks5-proxy-*
            artifacts/**/tunnel-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
