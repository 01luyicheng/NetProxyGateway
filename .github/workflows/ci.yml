name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Self-hosted runner (shared with dev branch workflows) has the Android SDK
  # pre-installed at /opt/android-sdk. ubuntu-latest is blocked by a GitHub
  # Actions spending-limit / payment failure, which caused every PR targeting
  # main to fail in ~3s ("The job was not started because recent account
  # payments have failed or your spending limit needs to be increased").
  # Switching to the self-hosted runner unblocks those PRs without incurring
  # Actions minutes charges. See issue #89.
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  android-build:
    name: Android Build & Test
    runs-on: [self-hosted, Linux, X64, do-sfo3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build with Gradle
        run: ./android/gradlew -p android assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Run unit tests
        run: ./android/gradlew -p android :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./android/gradlew -p android jacocoTestReport --stacktrace --no-daemon
        continue-on-error: false

      - name: Run Lint check
        run: ./android/gradlew -p android lintDebug --no-daemon
        continue-on-error: false

      - name: Run dependency vulnerability check
        run: ./android/gradlew -p android dependencyCheckAnalyze --no-daemon
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage-report
          path: android/app/build/reports/jacoco/

      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-dependency-check-report
          path: android/app/build/reports/dependency-check-report.html

      # Commit lint as a step (not a separate job) to save runner startup time
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
        continue-on-error: false

  go-build:
    name: Go Server Build
    runs-on: [self-hosted, Linux, X64, do-sfo3]
    strategy:
      matrix:
        component: [api, socks5-proxy, tunnel]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.component }}-${{ hashFiles('server/${{ matrix.component }}/go.sum', 'server/${{ matrix.component }}/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.component }}-
            ${{ runner.os }}-go-

      - name: Build ${{ matrix.component }}
        working-directory: server/${{ matrix.component }}
        run: go build -v ./...

      - name: Test ${{ matrix.component }}
        working-directory: server/${{ matrix.component }}
        run: go test -v -coverprofile=coverage.out ./...

      - name: Install govulncheck
        if: always()
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability check
        if: always()
        working-directory: server/${{ matrix.component }}
        run: govulncheck ./...
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.component }}
          path: server/${{ matrix.component }}/coverage.out

  # Dependency review gate (issue #89 item 3).
  # NOTE: dependency-review-action requires GitHub Advanced Security (GHAS) /
  #       dependency graph enabled on the repository; otherwise the job may
  #       fail with a billing/permissions error. This is a repository setting,
  #       not a code issue, and is intentionally left unchanged here.
  # This is the ONLY universally-triggered, non-masked, CVSS>=7.0 dependency-CVE
  # gate covering both the Go and Android ecosystems on every PR targeting main.
  # It mirrors the `dependency-review` job in dev's .github/workflows/pr-checks.yml.
  # Do NOT add `continue-on-error: true` here and do NOT downgrade
  # `fail-on-severity` beyond `high` — that would silently flip a red CVE signal
  # green (see docs/ISSUES.md CI-DEP-1 / N90 on the dev branch for prior
  # regressions where this gate was removed or masked).
  dependency-review:
    name: Dependency Review
    runs-on: [self-hosted, Linux, X64, do-sfo3]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # actions/dependency-review-action calls the dependency-graph compare
      # API, which on PRIVATE repositories requires GitHub Advanced Security
      # (GHAS) to be enabled (plus the dependency graph). This repo is private
      # and does NOT currently have GHAS, so the action errors out with
      # "Dependency review is not supported on this repository" — a
      # repository-settings/billing limitation, NOT a CVE signal. That
      # hard-error blocks every PR targeting main. Probe the compare endpoint
      # first; run the real CVE gate only when the API is actually available,
      # so the gate stays a hard `fail-on-severity: high` check wherever GHAS
      # is enabled and degrades to a skip (not a red error) where it is not.
      # See issue #89 and docs/ISSUES.md CI-DEP-1. Mirrors the fix in dev's
      # pr-checks.yml (PR #139). TODO(owner): enable GHAS (or make the repo
      # public) then remove this probe so the gate runs unconditionally again.
      - name: Probe dependency-review support
        id: dep_probe
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_BASE: ${{ github.event.pull_request.base.sha }}
          GH_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/dependency-graph/compare/${GH_BASE}...${GH_HEAD}" || echo '000')
          echo "probe_http=${code}" >> "$GITHUB_OUTPUT"
          # 403/404 => dependency-review API unavailable on this repo (GHAS /
          # dependency graph disabled). Anything else (200, transient network
          # error) => run the real gate; never silently disable it on errors.
          if [ "$code" = "403" ] || [ "$code" = "404" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "dependency-review API unavailable (HTTP ${code}); skipping gate (GHAS not enabled)."
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "dependency-review API available (HTTP ${code}); running gate."
          fi

      # SECURITY GATE: do NOT add `continue-on-error: true` here, and do NOT
      # downgrade `fail-on-severity` beyond `high` — that would silently flip
      # a red CVE signal green (see docs/ISSUES.md CI-DEP-1 / N90). The
      # step-level `if:` below ONLY skips the gate when the probe above proved
      # the dependency-review API is unavailable on this repo (GHAS disabled)
      # — it does NOT mask CVEs. When GHAS is enabled the gate runs
      # unconditionally with `fail-on-severity: high`.
      - name: Dependency review
        if: ${{ steps.dep_probe.outputs.supported != 'false' }}
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

