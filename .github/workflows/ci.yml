name: CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  android-build:
    name: Android Build & Test
    runs-on: [self-hosted, linux, x64, do-sfo3]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build with Gradle
        run: ./android/gradlew -p android assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: android/b/app/build/outputs/apk/debug/*.apk

      - name: Run unit tests
        run: ./android/gradlew -p android :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./android/gradlew -p android jacocoTestReport --stacktrace --no-daemon

      - name: Run Lint check
        run: ./android/gradlew -p android lintDebug --no-daemon
        continue-on-error: true

      - name: Run dependency vulnerability check
        run: ./android/gradlew -p android dependencyCheckAnalyze --no-daemon
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android/b/app/build/reports/tests/
            android/b/app/build/test-results/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage-report
          path: android/b/app/build/reports/jacoco/

      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: |
            android/b/app/build/reports/lint-results-debug.html
            android/b/app/build/reports/lint-results-debug.xml

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-dependency-check-report
          path: android/b/app/build/reports/dependency-check-report.html

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
        continue-on-error: false

  go-build:
    name: Go Server Build
    runs-on: [self-hosted, linux, x64, do-sfo3]
    timeout-minutes: 15
    strategy:
      matrix:
        component: [api, socks5-proxy, tunnel]
        fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/go-mod-${{ matrix.component }}
          key: ${{ runner.os }}-go-${{ matrix.component }}-${{ hashFiles('server/${{ matrix.component }}/go.sum', 'server/${{ matrix.component }}/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.component }}-

      - name: Link GOPATH mod cache
        run: |
          mkdir -p ~/go/pkg
          ln -sf "${{ runner.temp }}/go-mod-${{ matrix.component }}" ~/go/pkg/mod 2>/dev/null || true
          ls -la ~/go/pkg/mod 2>&1 | head -3

      - name: Build ${{ matrix.component }}
        working-directory: server/${{ matrix.component }}
        run: go build -v ./...

      - name: Test ${{ matrix.component }}
        working-directory: server/${{ matrix.component }}
        run: go test -v -coverprofile=coverage.out ./...

      - name: Install govulncheck
        if: always()
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability check
        if: always()
        working-directory: server/${{ matrix.component }}
        run: govulncheck ./...
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.component }}
          path: server/${{ matrix.component }}/coverage.out
